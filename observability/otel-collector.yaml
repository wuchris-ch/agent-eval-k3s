extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.provider.name
        action: delete
      - key: llm.system
        action: delete
      - key: server.address
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: enduser.id
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_http/phoenix:
    endpoint: http://phoenix:6006
    headers:
      x-project-name: agent-eval
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/privacy
        - batch
      exporters:
        - otlp_http/phoenix
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/privacy
        - batch
      exporters:
        - prometheus
