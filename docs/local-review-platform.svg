<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Agent evaluation and observability architecture</title>
  <desc id="description">Versioned inputs and golden evidence enter a blind evaluation pipeline. External review agents or isolated coding agents execute, deterministic scoring and optional correction produce an explicit release gate, and privacy-filtered telemetry flows to Phoenix. Kubernetes keeps the worker and scheduler running locally.</desc>
  <defs>
    <style>
      :root {
        --canvas: #ffffff; --ink: #202533; --muted: #667085; --line: #d8dde8; --flow: #7b8799; --card: #ffffff;
        --blue: #eef7ff; --blue-line: #83b8e8; --amber: #fff9e9; --amber-line: #dfb765;
        --violet: #f7f1ff; --violet-line: #a58bdd; --green: #effaf3; --green-line: #7fbc92;
        --gate: #7765c8; --gate-ink: #ffffff;
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .canvas { fill: var(--canvas); }
      .group { stroke-width: 1.5; }
      .blue-group { fill: var(--blue); stroke: var(--blue-line); }
      .amber-group { fill: var(--amber); stroke: var(--amber-line); }
      .violet-group { fill: var(--violet); stroke: var(--violet-line); }
      .green-group { fill: var(--green); stroke: var(--green-line); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.25; }
      .boundary { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 7 6; }
      .flow { fill: none; stroke: var(--flow); stroke-width: 1.8; marker-end: url(#arrow); }
      .optional { fill: none; stroke: var(--violet-line); stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#violet-arrow); }
      .title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .subtitle { font-size: 15px; fill: var(--muted); }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 0.11em; fill: var(--muted); }
      .node-title { font-size: 16px; font-weight: 650; }
      .detail { font-size: 13px; fill: var(--muted); }
      .small { font-size: 11px; fill: var(--muted); }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
      .gate { fill: var(--gate); }
      .gate-title { font-size: 17px; font-weight: 700; fill: var(--gate-ink); }
      .gate-detail { font-size: 13px; fill: var(--gate-ink); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--flow)"/>
    </marker>
    <marker id="violet-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--violet-line)"/>
    </marker>
  </defs>

  <rect class="canvas" width="1440" height="900"/>
  <text class="title" x="54" y="52">Agent evaluation, from golden case to release gate</text>
  <text class="subtitle" x="54" y="78">Blind inputs, independent evidence, repeatable scoring, local Kubernetes orchestration, and privacy-filtered traces</text>

  <rect class="group blue-group" x="54" y="112" width="390" height="172" rx="12"/>
  <text class="section" x="78" y="139">ENTRY POINTS</text>
  <rect class="card" x="78" y="158" width="342" height="98" rx="8"/>
  <text class="node-title" x="98" y="185">Manual, scheduled, or CI-driven</text>
  <text class="detail" x="98" y="208">./review-stack eval</text>
  <text class="detail" x="98" y="229">Nightly Kubernetes CronJob</text>
  <text class="detail" x="98" y="250">agent-eval run / evaluate / eval-review-agent</text>

  <rect class="group amber-group" x="474" y="112" width="492" height="172" rx="12"/>
  <text class="section" x="498" y="139">VERSIONED EVIDENCE</text>
  <rect class="card" x="498" y="158" width="444" height="98" rx="8"/>
  <text class="node-title" x="518" y="185">Reviewer corpus v1.1.0</text>
  <text class="detail" x="518" y="208">20 golden diffs: 13 faulty + 7 clean</text>
  <text class="detail" x="518" y="229">Expected file, category, severity, and changed-line range</text>
  <text class="detail" x="518" y="250">Artifact hashes + optional executable reproducers</text>

  <rect class="group violet-group" x="996" y="112" width="390" height="172" rx="12"/>
  <text class="section" x="1020" y="139">TARGETS UNDER TEST</text>
  <rect class="card" x="1020" y="158" width="342" height="98" rx="8"/>
  <text class="node-title" x="1040" y="185">One harness, multiple target types</text>
  <text class="detail" x="1040" y="208">External pull-request reviewer executable</text>
  <text class="detail" x="1040" y="229">Coding agent in an isolated k3s pod</text>
  <text class="detail" x="1040" y="250">Already-produced workspace</text>

  <path class="flow" d="M249 284 V322 H190 V365"/>
  <path class="flow" d="M720 284 V322 H492 V365"/>
  <path class="flow" d="M1191 284 V322 H790 V365"/>

  <rect class="boundary" x="54" y="338" width="1332" height="320" rx="14"/>
  <text class="section" x="78" y="365">EVALUATION HARNESS</text>

  <text class="step" x="78" y="403">01  BLIND INPUT</text>
  <rect class="card" x="78" y="418" width="224" height="142" rx="9"/>
  <text class="node-title" x="98" y="449">Bind exact input</text>
  <text class="detail" x="98" y="475">Raw diff or task snapshot</text>
  <text class="detail" x="98" y="498">SHA-256 identity</text>
  <text class="detail" x="98" y="521">Hide goldens and thresholds</text>
  <text class="small" x="98" y="545">Fail closed on invalid artifacts</text>

  <text class="step" x="348" y="403">02  EXECUTE</text>
  <rect class="card" x="348" y="418" width="246" height="142" rx="9"/>
  <text class="node-title" x="368" y="449">Run the target</text>
  <text class="detail" x="368" y="475">Bounded process or isolated pod</text>
  <text class="detail" x="368" y="498">Allowlisted environment</text>
  <text class="detail" x="368" y="521">Timeout + process-group cleanup</text>
  <text class="small" x="368" y="545">Capture first attempt separately</text>

  <text class="step" x="640" y="403">03  VERIFY + SCORE</text>
  <rect class="card" x="640" y="418" width="280" height="142" rx="9"/>
  <text class="node-title" x="660" y="449">Independent evidence</text>
  <text class="detail" x="660" y="475">Strict JSON + digest validation</text>
  <text class="detail" x="660" y="498">Finding F1 + block decision</text>
  <text class="detail" x="660" y="521">Hidden tests + scanners for code</text>
  <text class="small" x="660" y="545">Optional GEval cannot loosen goldens</text>

  <text class="step" x="966" y="403">04  AGGREGATE</text>
  <rect class="gate" x="966" y="418" width="372" height="142" rx="9"/>
  <text class="gate-title" x="988" y="449">Release-quality cohort gate</text>
  <text class="gate-detail" x="988" y="476">0 infrastructure errors</text>
  <text class="gate-detail" x="988" y="499">100% security-blocker recall</text>
  <text class="gate-detail" x="988" y="522">≥95% clean accuracy + 100% case stability</text>
  <text class="gate-detail" x="988" y="545">Explicit PASS or FAIL</text>

  <path class="flow" d="M302 489 H348"/>
  <path class="flow" d="M594 489 H640"/>
  <path class="flow" d="M920 489 H966"/>
  <path class="optional" d="M780 560 V605 H471 V560"/>
  <text class="small" x="625" y="626" text-anchor="middle">valid rejection only: one critique-guided correction, original result preserved</text>

  <path class="flow" d="M1152 560 V690 H1190 V720"/>
  <path class="flow" d="M1152 560 V682 H716 V720"/>
  <path class="optional" d="M780 560 V676 H250 V720"/>

  <rect class="group violet-group" x="54" y="720" width="392" height="132" rx="12"/>
  <text class="section" x="78" y="748">OBSERVABILITY</text>
  <text class="node-title" x="78" y="779">OpenTelemetry → Collector → Phoenix</text>
  <text class="detail" x="78" y="803">Scores, outcomes, latency, attempts, and counts</text>
  <text class="detail" x="78" y="826">Collector strips content, endpoints, and authorization</text>

  <rect class="group blue-group" x="474" y="720" width="484" height="132" rx="12"/>
  <text class="section" x="498" y="748">LOCAL K3S OPERATIONS</text>
  <text class="node-title" x="498" y="779">Deployment + CronJob + persistent volumes</text>
  <text class="detail" x="498" y="803">Kubernetes keeps the PR worker, telemetry, and dashboard alive</text>
  <text class="detail" x="498" y="826">Scheduled evaluations run once, persist their report, then exit</text>

  <rect class="group green-group" x="986" y="720" width="400" height="132" rx="12"/>
  <text class="section" x="1010" y="748">DURABLE OUTPUT</text>
  <text class="node-title" x="1010" y="779">JSON report + versioned baseline</text>
  <text class="detail" x="1010" y="803">Every trial and correction remains auditable</text>
  <text class="detail" x="1010" y="826">Content-minimized record is safe to publish</text>

  <text class="small" x="54" y="884">The evaluator owns the evidence and verdict. The agent under test never sees the golden answer and cannot rewrite the final score.</text>
</svg>
